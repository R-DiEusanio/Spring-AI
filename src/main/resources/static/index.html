<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spring AI Chat</title>
  <style>
    body {
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .chat-box {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
      min-height: 180px;
      max-height: 300px;
      margin-top: 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 16px;
    }

    .message { margin: 10px 0; }
    .user { color: #007bff; }
    .assistant { color: #222; background: #e3f3fe; border-radius:8px; padding:7px 12px; display: inline-block;}
    .system { color: #777; font-style: italic; }

    .input-area {
      margin-top: 20px;
      display: flex;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:disabled { background: #aaa; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #0056b3; }

    .loading {
      font-style: italic;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Chat with Spring AI</h2>

  <div class="chat-box" id="chatBox"></div>

  <div class="loading" id="loading" style="display: none;">Loading...</div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Write a message..." autocomplete="off" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const sessionId = "default-session"; // puoi cambiarlo per multiutente
  const chatBox = document.getElementById("chatBox");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const loading = document.getElementById("loading");

  // Carica storico all'avvio
  window.onload = loadHistory;

  // Invio con Enter
  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
  });

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.classList.add("message", role);
    if (role === "user")      div.innerHTML = `<b>You:</b> ${text}`;
    else if (role === "assistant") div.innerHTML = `<b>AI:</b> ${text}`;
    else                       div.innerHTML = `<i>${role}</i>: ${text}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function loadHistory() {
    fetch(`/chat/${sessionId}`)
      .then(res => res.json())
      .then(history => {
        chatBox.innerHTML = "";
        history.forEach(msg => appendMessage(msg.messageType.toLowerCase(), msg.text));
      })
      .catch(() => { chatBox.innerHTML = "<i>No history.</i>"; });
  }

  function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    appendMessage("user", message);
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;
    loading.style.display = "block";

    fetch(`/chat/${sessionId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: message
    })
      .then(res => res.json())
      .then(aiMsg => {
        appendMessage("assistant", aiMsg.text);
        input.disabled = false;
        sendBtn.disabled = false;
        loading.style.display = "none";
      })
      .catch(err => {
        appendMessage("system", "Errore: " + err);
        input.disabled = false;
        sendBtn.disabled = false;
        loading.style.display = "none";
      });
  }
</script>
</body>
</html>
