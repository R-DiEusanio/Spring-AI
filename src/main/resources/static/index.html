<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>AI Chat Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        min-height: 100vh;
    }
    .chat-container {
        max-width: 600px;
        margin: 40px auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 32px rgba(76,81,255,0.10);
        padding: 2rem;
    }
    .message.ai {
        background: #eef2ff;
        border-left: 5px solid #6366f1;
    }
    .message.user {
        background: #f1f5f9;
        border-left: 5px solid #a3e635;
    }
    .message {
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
        font-size: 1.05rem;
        word-break: break-word;
    }
    .textarea-resize-none {
        resize: none;
    }
    .spinner-border {
        width: 2rem;
        height: 2rem;
        vertical-align: middle;
        margin-right: 10px;
    }
    .loader-message {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        background: #eef2ff;
        border-left: 5px solid #6366f1;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
        font-size: 1.05rem;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <h2 class="mb-4 text-center text-primary">💬 AI Chat Demo</h2>
  <div id="messages"></div>
  <form id="chatForm" class="d-flex flex-column gap-2">
    <textarea id="userInput" class="form-control textarea-resize-none" rows="3" placeholder="Scrivi il tuo messaggio..." required autofocus></textarea>
    <button type="submit" class="btn btn-primary">Invia</button>
  </form>
</div>

<script>
  const form = document.getElementById('chatForm');
  const input = document.getElementById('userInput');
  const messagesDiv = document.getElementById('messages');
  let loaderDiv = null;

  function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerHTML = sender === 'user'
          ? `<strong>Tu:</strong> ${text}`
          : `<strong>AI:</strong> ${text}`;
      messagesDiv.appendChild(msgDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showLoader() {
      loaderDiv = document.createElement('div');
      loaderDiv.classList.add('loader-message');
      loaderDiv.innerHTML = `<div class="spinner-border text-primary" role="status"></div> <span>L'AI sta pensando...</span>`;
      messagesDiv.appendChild(loaderDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeLoader() {
      if (loaderDiv) {
          messagesDiv.removeChild(loaderDiv);
          loaderDiv = null;
      }
  }

  form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      addMessage(userText, 'user');
      input.value = '';
      input.disabled = true;
      showLoader();

      try {
          const lower = userText.toLowerCase();
          const isCommand = lower.includes("add student")
              || lower.includes("create student")
              || lower.includes("delete student")
              || lower.includes("update student")
              || lower.includes("matricola");

          const endpoint = isCommand ? '/chat/command' : '/chat/ask';

          const response = await fetch(endpoint, {
              method: 'POST',
              headers: {'Content-Type': 'text/plain'},
              body: userText
          });

          removeLoader();

          if (!response.ok) {
              addMessage('Errore dal server: ' + response.status, 'ai');
              return;
          }

          const aiText = await response.text();
          addMessage(aiText, 'ai');

      } catch (err) {
          removeLoader();
          addMessage('Errore di connessione al server.', 'ai');
      } finally {
          input.disabled = false;
          input.focus();
      }
  });

  window.onload = () => input.focus();
</script>
</body>
</html>
